<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Bibliotecas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        #mapa { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        .info-panel h3 { margin-bottom: 6px; color: #333; }
        .info-panel p { color: #666; }
    </style>
</head>
<body>
    <div id="mapa"></div>
    <div class="info-panel">
        <h3>Bibliotecas</h3>
        <p>Total: {{ total }}</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('mapa').setView([20.0, -99.0], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19,
        }).addTo(map);

        const bibliotecas = {{ bibliotecas_json|safe }};

        if (bibliotecas.length > 0) {
            const bounds = [];
            bibliotecas.forEach(b => {
                const marker = L.marker([b.latitud, b.longitud]).addTo(map);
                marker.bindPopup(`
                    <b>${b.nombre}</b><br>
                    ${b.direccion_completa}<br>
                    ${b.telefono ? 'Tel: ' + b.telefono + '<br>' : ''}
                    ${b.horario ? 'Horario: ' + b.horario + '<br>' : ''}
                    ${b.google_maps_url ? '<a href="' + b.google_maps_url + '" target="_blank">Ver en Google Maps</a>' : ''}
                `);
                bounds.push([b.latitud, b.longitud]);
            });
            map.fitBounds(bounds, { padding: [40, 40] });
        }
    </script>
</body>
</html>
